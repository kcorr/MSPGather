<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sign in · MSPGather</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-brand">
      <img src="logo.svg" alt="" width="44" height="44">
      <div>
        <div class="login-title">MSPGather</div>
        <div class="login-sub">Discover · Harden · Troubleshoot</div>
      </div>
    </div>
    <section class="card login-card">
      <div class="card-body" id="login-root">
        <div class="loading"><div class="spinner"></div>Loading…</div>
      </div>
    </section>
    <p class="login-foot">Authorised users only. Sign-ins and tool use are logged.<br>
      Active tests (port, TLS and SMTP probes) may only be run against systems you own or are permitted to test.</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
