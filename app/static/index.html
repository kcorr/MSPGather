<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSPGather</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta name="description" content="MSPGather: self-hosted troubleshooting and discovery toolkit for MSP engineers.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="logo.svg" alt="" width="30" height="30">
        <div>
          <div class="brand-name">MSPGather</div>
          <div class="brand-sub">MSP troubleshooting toolkit</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="user-box" id="user-box" hidden></div>
      <div class="sidebar-foot">
        <span id="version"></span>
        <button class="icon-btn" id="theme-toggle" type="button" title="Toggle theme">Theme</button>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <script src="core.js"></script>
  <!--TOOL_SCRIPTS-->
</body>
</html>
