<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSPGather</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta name="description" content="MSPGather: discovery, hardening and troubleshooting toolkit for MSP engineers.">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="discover">
  <a class="skip" href="#main" id="skip-link">Skip to content</a>
  <header class="topbar" id="topbar"></header>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Tools"></aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div class="backdrop" id="backdrop" hidden></div>
  <div class="palette" id="palette" hidden></div>
  <div class="sheet-wrap" id="sheet" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="core.js"></script>
  <!--TOOL_SCRIPTS-->
</body>
</html>
